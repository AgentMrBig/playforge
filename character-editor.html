<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>PLAYFORGE — Character / Ragdoll Editor</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #171c24; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; left: 12px; top: 10px; color: #fff; font: 13px/1.5 system-ui, sans-serif;
         user-select: none; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.6); max-width: 46vw; }
  #hud b { color: #ffd75e; }
  #build { position: fixed; left: 12px; bottom: 8px; color: #6d7f90; font: 11px ui-monospace, monospace;
           user-select: none; pointer-events: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><b>PLAYFORGE — Character / Ragdoll Editor</b> · drag orbit · wheel zoom<br>
D drop · H punch · L launch · T trip · C clothesline · M muscle · G get up · R reset · P pause · . step · , slow-mo<br>
<span id="status">loading…</span></div>
<div id="build">build __BUILD_TIME__</div>
<script type="module" src="/demo/chareditor.js"></script>
</body>
</html>
